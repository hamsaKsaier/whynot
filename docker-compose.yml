services:
  database:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-thundercode}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-thundercode}
      - POSTGRES_DB=${POSTGRES_DB:-thundercode}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/database/migrations:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thundercode}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    ports:
      - "8010:8000"
    env_file:
      - .env
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4}
      - OPENAI_VISION_MODEL=${OPENAI_VISION_MODEL:-gpt-4o}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      - CORS_ORIGINS=http://localhost:3010,http://localhost:3011,http://localhost:5183
    volumes:
      - ./services/ai-service/app:/app/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" 2>/dev/null && echo ok"]
      interval: 30s
      timeout: 10s
      retries: 3

  test-executor:
    build:
      context: .
      dockerfile: ./services/test-executor/Dockerfile
    ports:
      - "3011:3001"
    environment:
      - PW_TEST_SCREENSHOT_NO_FONTS_READY=1
      - PORT=3001
      - AI_SERVICE_URL=http://ai-service:8000
      - SCREENSHOTS_DIR=/app/screenshots
      - DATABASE_URL=postgresql://${POSTGRES_USER:-thundercode}:${POSTGRES_PASSWORD:-thundercode}@database:5432/${POSTGRES_DB:-thundercode}
      - NODE_ENV=production
      - DOCKER_ENV=true
      # Optimized timeouts for faster execution
      - SCREENSHOT_TIMEOUT_MS=${SCREENSHOT_TIMEOUT_MS:-10000}
      - NAVIGATION_TIMEOUT_MS=${NAVIGATION_TIMEOUT_MS:-30000}
      - NAVIGATION_MAX_TIMEOUT_MS=${NAVIGATION_MAX_TIMEOUT_MS:-60000}
      # Visual Regression Settings
      - VISUAL_REGRESSION_ENABLED=${VISUAL_REGRESSION_ENABLED:-true}
      - VISUAL_REGRESSION_PIXEL_THRESHOLD=${VISUAL_REGRESSION_PIXEL_THRESHOLD:-0.01}
      - VISUAL_REGRESSION_AI_ANALYSIS_ENABLED=${VISUAL_REGRESSION_AI_ANALYSIS_ENABLED:-true}
      - VISUAL_REGRESSION_AUTO_BASELINE=${VISUAL_REGRESSION_AUTO_BASELINE:-true}
      - VISUAL_REGRESSION_DIFF_DIR=/app/visual-diffs
      - VIDEO_DIR=/app/videos
    volumes:
      - ./services/test-executor/src:/app/src
      - ./shared:/app/shared
      - screenshots:/app/screenshots
      - visual-diffs:/app/visual-diffs
      - videos:/app/videos
    depends_on:
      database:
        condition: service_healthy
      ai-service:
        condition: service_started
    restart: unless-stopped
    # Resource limits to prevent resource exhaustion
    deploy:
      resources:
        limits:
          cpus: "${TEST_EXECUTOR_CPUS:-2.0}"
          memory: ${TEST_EXECUTOR_MEMORY:-4G}
        reservations:
          cpus: "${TEST_EXECUTOR_CPUS_RESERVED:-1.0}"
          memory: ${TEST_EXECUTOR_MEMORY_RESERVED:-2G}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/health',(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3

  qa-loop-executor:
    build:
      context: .
      dockerfile: ./services/qa-loop-executor/Dockerfile
    ports:
      - "3012:3002"
    env_file:
      - .env
    environment:
      - PORT=3002
      - TEST_EXECUTOR_URL=http://test-executor:3001
      - DATABASE_URL=postgresql://${POSTGRES_USER:-thundercode}:${POSTGRES_PASSWORD:-thundercode}@database:5432/${POSTGRES_DB:-thundercode}
      - NODE_ENV=production
    volumes:
      - ./services/qa-loop-executor/src:/app/src
      - ./shared:/app/shared
    depends_on:
      database:
        condition: service_healthy
      test-executor:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3002/health',(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3

  gateway:
    build:
      context: .
      dockerfile: ./gateway/Dockerfile
    ports:
      - "3010:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - FRONTEND_URL=http://localhost:5183
      - AI_SERVICE_URL=http://ai-service:8000
      - TEST_EXECUTOR_URL=http://test-executor:3001
      - QA_LOOP_EXECUTOR_URL=http://qa-loop-executor:3002
      - DATABASE_URL=postgresql://${POSTGRES_USER:-thundercode}:${POSTGRES_PASSWORD:-thundercode}@database:5432/${POSTGRES_DB:-thundercode}
      - NODE_ENV=production
      - RATE_LIMIT_TEST_EXECUTION_MAX=${RATE_LIMIT_TEST_EXECUTION_MAX:-50}
      - RATE_LIMIT_TEST_GENERATION_MAX=${RATE_LIMIT_TEST_GENERATION_MAX:-50}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-200}
      - JWT_SECRET=${JWT_SECRET:-change-me-to-a-long-random-string-before-production}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITHUB_CALLBACK_URL=${GITHUB_CALLBACK_URL:-http://localhost:3010/api/auth/github/callback}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL:-http://localhost:3010/api/auth/google/callback}
      - SCREENSHOT_RETENTION_DAYS=${SCREENSHOT_RETENTION_DAYS:-30}
      - VIDEO_DIR=/app/videos
    volumes:
      - ./gateway/src:/app/src
      - ./shared:/app/shared
      - videos:/app/videos
    depends_on:
      database:
        condition: service_healthy
      ai-service:
        condition: service_started
      test-executor:
        condition: service_started
      qa-loop-executor:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health',(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5183:5183"
    environment:
      - VITE_API_URL=http://localhost:3010/api
      - VITE_WS_URL=ws://localhost:3011
      - VITE_QA_LOOP_WS_URL=ws://localhost:3012
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - gateway
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0

volumes:
  screenshots:
  postgres_data:
  visual-diffs:
  videos: