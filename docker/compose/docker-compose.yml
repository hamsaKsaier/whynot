services:
  database:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-whynot}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-whynot}
      - POSTGRES_DB=${POSTGRES_DB:-whynot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whynot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-migrate:
    image: postgres:16-alpine
    volumes:
      - ../../services/database/migrations:/migrations:ro
      - ../../services/database/migrate.sh:/migrate.sh:ro
    environment:
      - POSTGRES_HOST=database
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-whynot}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-whynot}
      - POSTGRES_DB=${POSTGRES_DB:-whynot}
      - MIGRATIONS_DIR=/migrations
    entrypoint: ["sh", "/migrate.sh"]
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  ai-service:
    build:
      context: ../../services/ai-service
      dockerfile: Dockerfile
    ports:
      - "${AI_SERVICE_PORT:-8010}:8000"
    env_file:
      - ../../.env
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      - GATEWAY_URL=http://gateway:3000
      - CORS_ORIGINS=http://localhost:${GATEWAY_PORT:-3010},http://localhost:${TEST_EXECUTOR_PORT:-3011},http://localhost:${FRONTEND_PORT:-5183}
    volumes:
      - ../../services/ai-service/app:/app/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" 2>/dev/null && echo ok"]
      interval: 30s
      timeout: 10s
      retries: 3

  test-executor:
    build:
      context: ../..
      dockerfile: services/test-executor/Dockerfile
    ports:
      - "${TEST_EXECUTOR_PORT:-3011}:3001"
    environment:
      - PW_TEST_SCREENSHOT_NO_FONTS_READY=1
      - PORT=3001
      - AI_SERVICE_URL=http://ai-service:8000
      - SCREENSHOTS_DIR=/app/screenshots
      - DATABASE_URL=postgresql://${POSTGRES_USER:-whynot}:${POSTGRES_PASSWORD:-whynot}@database:5432/${POSTGRES_DB:-whynot}
      - NODE_ENV=production
      - DOCKER_ENV=true
      - SCREENSHOT_TIMEOUT_MS=${SCREENSHOT_TIMEOUT_MS:-10000}
      - NAVIGATION_TIMEOUT_MS=${NAVIGATION_TIMEOUT_MS:-30000}
      - NAVIGATION_MAX_TIMEOUT_MS=${NAVIGATION_MAX_TIMEOUT_MS:-60000}
      - VISUAL_REGRESSION_ENABLED=${VISUAL_REGRESSION_ENABLED:-true}
      - VISUAL_REGRESSION_PIXEL_THRESHOLD=${VISUAL_REGRESSION_PIXEL_THRESHOLD:-0.01}
      - VISUAL_REGRESSION_AI_ANALYSIS_ENABLED=${VISUAL_REGRESSION_AI_ANALYSIS_ENABLED:-true}
      - VISUAL_REGRESSION_AUTO_BASELINE=${VISUAL_REGRESSION_AUTO_BASELINE:-true}
      - VISUAL_REGRESSION_DIFF_DIR=/app/visual-diffs
      - VIDEO_DIR=/app/videos
    volumes:
      - ../../services/test-executor/src:/app/src
      - ../../shared:/app/shared
      - screenshots:/app/screenshots
      - visual-diffs:/app/visual-diffs
      - videos:/app/videos
    depends_on:
      database:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      ai-service:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${TEST_EXECUTOR_CPUS:-2.0}"
          memory: ${TEST_EXECUTOR_MEMORY:-4G}
        reservations:
          cpus: "${TEST_EXECUTOR_CPUS_RESERVED:-1.0}"
          memory: ${TEST_EXECUTOR_MEMORY_RESERVED:-2G}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/health',(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3

  qa-loop-executor:
    build:
      context: ../..
      dockerfile: services/qa-loop-executor/Dockerfile
    ports:
      - "${QA_LOOP_EXECUTOR_PORT:-3012}:3002"
    env_file:
      - ../../.env
    environment:
      - PORT=3002
      - TEST_EXECUTOR_URL=http://test-executor:3001
      - DATABASE_URL=postgresql://${POSTGRES_USER:-whynot}:${POSTGRES_PASSWORD:-whynot}@database:5432/${POSTGRES_DB:-whynot}
      - NODE_ENV=production
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://whynot.skrum.io,http://localhost:5173,http://localhost:5183,http://localhost:5184}
      - QA_LOOP_WS_SECRET=${QA_LOOP_WS_SECRET}
    volumes:
      - ../../services/qa-loop-executor/src:/app/src
      - ../../shared:/app/shared
    depends_on:
      database:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      test-executor:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3002/health',(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3

  recon-executor:
    build:
      context: ../../services/recon-executor
      dockerfile: Dockerfile
    ports:
      - "${RECON_EXECUTOR_PORT:-3013}:8001"
    env_file:
      - ../../.env
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      - GATEWAY_INTERNAL_URL=http://gateway:3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-whynot}:${POSTGRES_PASSWORD:-whynot}@database:5432/${POSTGRES_DB:-whynot}
      - NODE_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      # Scanned-repo mount is read-only — the executor must never write into a
      # target repository (recon-safety: upstream tool safety posture).
      - ${RECON_SCAN_REPO_PATH:-/tmp/recon-repos}:/scan-repos:ro
    depends_on:
      database:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      gateway:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  gateway:
    build:
      context: ../..
      dockerfile: gateway/Dockerfile
    ports:
      - "${GATEWAY_PORT:-3010}:3000"
    env_file:
      - ../../.env
    environment:
      - PORT=3000
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5183}
      - ADMIN_FRONTEND_URL=${ADMIN_FRONTEND_URL:-http://localhost:5184}
      - AI_SERVICE_URL=http://ai-service:8000
      - TEST_EXECUTOR_URL=http://test-executor:3001
      - QA_LOOP_EXECUTOR_URL=http://qa-loop-executor:3002
      - RECON_EXECUTOR_URL=http://recon-executor:8001
      - DATABASE_URL=postgresql://${POSTGRES_USER:-whynot}:${POSTGRES_PASSWORD:-whynot}@database:5432/${POSTGRES_DB:-whynot}
      - NODE_ENV=production
      - ALLOW_INTERNAL_SCAN=${ALLOW_INTERNAL_SCAN:-true}
      - RATE_LIMIT_TEST_EXECUTION_MAX=${RATE_LIMIT_TEST_EXECUTION_MAX:-50}
      - RATE_LIMIT_TEST_GENERATION_MAX=${RATE_LIMIT_TEST_GENERATION_MAX:-50}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-200}
      - JWT_SECRET=${JWT_SECRET:-change-me-to-a-long-random-string-before-production}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITHUB_CALLBACK_URL=${GITHUB_CALLBACK_URL:-http://localhost:3010/api/auth/github/callback}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL:-http://localhost:3010/api/auth/google/callback}
      - SCREENSHOT_RETENTION_DAYS=${SCREENSHOT_RETENTION_DAYS:-30}
      - VIDEO_DIR=/app/videos
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_SUCCESS_URL=${STRIPE_SUCCESS_URL:-http://localhost:5183/billing?success=true}
      - STRIPE_CANCEL_URL=${STRIPE_CANCEL_URL:-http://localhost:5183/billing?canceled=true}
      - SECRETS_ENCRYPTION_KEY=${SECRETS_ENCRYPTION_KEY:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - GATEWAY_URL=http://localhost:${GATEWAY_PORT:-3010}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ../../gateway/src:/app/gateway/src
      - ../../shared:/app/shared
      - videos:/app/videos
      - gateway_secrets:/app/gateway/secrets
    depends_on:
      database:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      ai-service:
        condition: service_started
      test-executor:
        condition: service_started
      qa-loop-executor:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health',(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
        - VITE_WS_URL=${VITE_WS_URL:-ws://localhost:3011}
        - VITE_QA_LOOP_WS_URL=${VITE_QA_LOOP_WS_URL:-}
    ports:
      - "${FRONTEND_PORT:-5183}:80"
    depends_on:
      - gateway
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  admin-frontend:
    build:
      context: ../../admin-frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${ADMIN_VITE_API_URL:-/api}
    ports:
      - "${ADMIN_FRONTEND_PORT:-5184}:80"
    depends_on:
      - gateway
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  screenshots:
  postgres_data:
  visual-diffs:
  videos:
  gateway_secrets:
