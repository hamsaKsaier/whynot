services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: whynot
      POSTGRES_PASSWORD: whynot
      POSTGRES_DB: whynot_test
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ../../services/database/migrations:/migrations:ro
      - ../../scripts/test-init-db.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whynot -d whynot_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway-test:
    build:
      context: ../..
      dockerfile: gateway/Dockerfile.test
    env_file:
      - ../../.env.test
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://whynot:whynot@postgres-test:5432/whynot_test
    depends_on:
      postgres-test:
        condition: service_healthy
    volumes:
      - ../../gateway/src:/app/gateway/src:ro
      - ../../shared:/app/shared:ro
      - ../../docs:/app/docs:ro
      - ../../gateway/vitest.config.ts:/app/gateway/vitest.config.ts:ro

  frontend-test:
    image: node:20-slim
    working_dir: /app/frontend
    env_file:
      - ../../.env.test
    environment:
      NODE_ENV: test
    volumes:
      - ../../frontend:/app/frontend
      - ../../shared:/app/shared
      - frontend_node_modules:/app/frontend/node_modules
    command: >
      sh -c "npm install --prefer-offline && npx vitest run --coverage"

  admin-frontend-test:
    image: node:20-slim
    working_dir: /app/admin-frontend
    env_file:
      - ../../.env.test
    environment:
      NODE_ENV: test
    volumes:
      - ../../admin-frontend:/app/admin-frontend
      - ../../shared:/app/shared
      - admin_frontend_node_modules:/app/admin-frontend/node_modules
    command: >
      sh -c "npm install --prefer-offline && npx vitest run --coverage"

  shared-test:
    image: node:20-slim
    working_dir: /app
    env_file:
      - ../../.env.test
    environment:
      NODE_ENV: test
    volumes:
      - ../../shared:/app
      - shared_node_modules:/app/node_modules
    command: >
      sh -c "npm install --prefer-offline && npx vitest run --coverage"

  playwright:
    image: mcr.microsoft.com/playwright:v1.48.0-jammy
    working_dir: /app
    env_file:
      - ../../.env.test
    environment:
      PLAYWRIGHT_BASE_URL: http://frontend:5183
    volumes:
      - ../../frontend:/app
      - playwright_node_modules:/app/node_modules
    command: >
      sh -c "npm install --prefer-offline && npx playwright test"
    depends_on:
      postgres-test:
        condition: service_healthy

  lighthouse:
    image: node:20-slim
    working_dir: /app
    volumes:
      - ../../frontend:/app:ro
      - lighthouse_node_modules:/app/node_modules
    command: >
      sh -c "npm install --prefer-offline && echo 'Lighthouse CI ready — run against built frontend'"

  # Intentionally-vulnerable target for recon integration tests. Pinned to a
  # specific version so the test results are reproducible. See
  # ``services/recon-executor/tests/integration/`` for the consumers.
  juice-shop:
    image: bkimminich/juice-shop:v15.0.0
    ports:
      - "3014:3000"
    environment:
      NODE_ENV: unsafe
    profiles: ["recon-integration"]
    healthcheck:
      test:
        - "CMD"
        - "/nodejs/bin/node"
        - "-e"
        - "require('http').get('http://localhost:3000/rest/admin/application-version', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 30

  recon-executor-test:
    build:
      context: ../../services/recon-executor
      dockerfile: Dockerfile
    working_dir: /w
    environment:
      DATABASE_URL: postgresql://whynot:whynot@postgres-test:5432/whynot_test
      LOG_LEVEL: INFO
      JUICE_SHOP_URL: http://juice-shop:3000
      RECON_INTEGRATION: "1"
    volumes:
      - ../../services/recon-executor:/w
    user: "0:0"
    profiles: ["recon-integration"]
    depends_on:
      postgres-test:
        condition: service_healthy
      juice-shop:
        condition: service_healthy
    command: >
      sh -c "pip install --quiet -r requirements-dev.txt &&
             pytest -q -o addopts='--cov=app --cov-branch --cov-report=term-missing --cov-fail-under=100'"

volumes:
  frontend_node_modules:
  admin_frontend_node_modules:
  shared_node_modules:
  playwright_node_modules:
  lighthouse_node_modules:
