services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: whynot
      POSTGRES_PASSWORD: whynot
      POSTGRES_DB: whynot_test
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./services/database/migrations:/migrations:ro
      - ./scripts/test-init-db.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whynot -d whynot_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway-test:
    build:
      context: .
      dockerfile: ./gateway/Dockerfile.test
    env_file:
      - .env.test
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://whynot:whynot@postgres-test:5432/whynot_test
    depends_on:
      postgres-test:
        condition: service_healthy
    volumes:
      - ./gateway/src:/app/gateway/src:ro
      - ./shared:/app/shared:ro
      - ./gateway/vitest.config.ts:/app/gateway/vitest.config.ts:ro
      - ./gateway/coverage:/app/gateway/coverage

  frontend-test:
    image: node:20-slim
    working_dir: /app
    env_file:
      - .env.test
    environment:
      NODE_ENV: test
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: >
      sh -c "npm install --prefer-offline && npx vitest run --coverage"

  admin-frontend-test:
    image: node:20-slim
    working_dir: /app
    env_file:
      - .env.test
    environment:
      NODE_ENV: test
    volumes:
      - ./admin-frontend:/app
      - admin_frontend_node_modules:/app/node_modules
    command: >
      sh -c "npm install --prefer-offline && npx vitest run --coverage"

  shared-test:
    image: node:20-slim
    working_dir: /app
    env_file:
      - .env.test
    environment:
      NODE_ENV: test
    volumes:
      - ./shared:/app
      - shared_node_modules:/app/node_modules
    command: >
      sh -c "npm install --prefer-offline && npx vitest run --coverage"

  playwright:
    image: mcr.microsoft.com/playwright:v1.48.0-jammy
    working_dir: /app
    env_file:
      - .env.test
    environment:
      PLAYWRIGHT_BASE_URL: http://frontend:5183
    volumes:
      - ./frontend:/app
      - playwright_node_modules:/app/node_modules
    command: >
      sh -c "npm install --prefer-offline && npx playwright test"
    depends_on:
      postgres-test:
        condition: service_healthy

  lighthouse:
    image: node:20-slim
    working_dir: /app
    volumes:
      - ./frontend:/app:ro
      - lighthouse_node_modules:/app/node_modules
    command: >
      sh -c "npm install --prefer-offline && echo 'Lighthouse CI ready — run against built frontend'"

volumes:
  frontend_node_modules:
  admin_frontend_node_modules:
  shared_node_modules:
  playwright_node_modules:
  lighthouse_node_modules:
