name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: whynot
          POSTGRES_PASSWORD: whynot
          POSTGRES_DB: whynot
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd gateway && npm ci
          cd ../services/test-executor && npm ci

      - name: Run linter
        run: |
          cd gateway && npm run lint || true
          cd ../services/test-executor && npm run lint || true

      - name: Run tests
        env:
          DATABASE_URL: postgresql://whynot:whynot@localhost:5432/whynot
        run: |
          cd gateway && npm test || true
          cd ../services/test-executor && npm test || true

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker images
        run: |
          docker compose build

























