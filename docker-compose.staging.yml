# WhyNot QA — Staging compose
# Runs on DIFFERENT ports than docker-compose.yml so both can coexist.
#
# Port map (prod → staging):
#   database       5433 → 5434
#   ai-service     8010 → 8110
#   test-executor  3011 → 3111
#   qa-loop-executor 3012 → 3112
#   gateway        3010 → 3110
#   frontend       5183 → 5283
#   admin-frontend 5184 → 5284
#
# Usage:
#   docker compose -f docker-compose.staging.yml --env-file .env.staging up -d --build
#   docker compose -f docker-compose.staging.yml --env-file .env.staging down

services:
  database:
    # Must match docker/compose/docker-compose.yml — staging exists to rehearse
    # the real stack, and migrations can behave differently across major versions.
    image: postgres:16-alpine
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-whynot_staging}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-whynot_staging}
      - POSTGRES_DB=${POSTGRES_DB:-whynot_staging}
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
      - /tmp/staging-init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whynot_staging}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    ports:
      - "8110:8000"
    env_file:
      - .env.staging
    environment:
      # ai-service (Python chatbot) only supports openai/anthropic. qa-loop-executor handles openrouter separately.
      - LLM_PROVIDER=anthropic
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      - CORS_ORIGINS=http://localhost:3110,http://localhost:3111,http://localhost:5283
    volumes:
      - ./services/ai-service/app:/app/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" 2>/dev/null && echo ok"]
      interval: 30s
      timeout: 10s
      retries: 3

  test-executor:
    build:
      context: ./services/test-executor
      dockerfile: Dockerfile
    ports:
      - "3111:3001"
    environment:
      - PW_TEST_SCREENSHOT_NO_FONTS_READY=1
      - PORT=3001
      - AI_SERVICE_URL=http://ai-service:8000
      - SCREENSHOTS_DIR=/app/screenshots
      - DATABASE_URL=postgresql://${POSTGRES_USER:-whynot_staging}:${POSTGRES_PASSWORD:-whynot_staging}@database:5432/${POSTGRES_DB:-whynot_staging}
      - NODE_ENV=staging
      - DOCKER_ENV=true
      - SCREENSHOT_TIMEOUT_MS=10000
      - NAVIGATION_TIMEOUT_MS=30000
      - NAVIGATION_MAX_TIMEOUT_MS=60000
      - VISUAL_REGRESSION_ENABLED=true
      - VISUAL_REGRESSION_PIXEL_THRESHOLD=0.01
      - VISUAL_REGRESSION_AI_ANALYSIS_ENABLED=true
      - VISUAL_REGRESSION_AUTO_BASELINE=true
      - VISUAL_REGRESSION_DIFF_DIR=/app/visual-diffs
      - VIDEO_DIR=/app/videos
    volumes:
      - ./services/test-executor/src:/app/src
      - ./shared:/app/shared
      - screenshots_staging:/app/screenshots
      - visual_diffs_staging:/app/visual-diffs
      - videos_staging:/app/videos
    depends_on:
      database:
        condition: service_healthy
      ai-service:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/health',(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3

  qa-loop-executor:
    build:
      context: ./services/qa-loop-executor
      dockerfile: Dockerfile
    ports:
      - "3112:3002"
    env_file:
      - .env.staging
    environment:
      - PORT=3002
      - TEST_EXECUTOR_URL=http://test-executor:3001
      - DATABASE_URL=postgresql://${POSTGRES_USER:-whynot_staging}:${POSTGRES_PASSWORD:-whynot_staging}@database:5432/${POSTGRES_DB:-whynot_staging}
      - NODE_ENV=staging
    volumes:
      - ./services/qa-loop-executor/src:/app/src
      - ./shared:/app/shared
    depends_on:
      database:
        condition: service_healthy
      test-executor:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3002/health',(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "3110:3000"
    env_file:
      - .env.staging
    environment:
      - PORT=3000
      - FRONTEND_URL=http://localhost:5283
      - ADMIN_FRONTEND_URL=http://localhost:5284
      - AI_SERVICE_URL=http://ai-service:8000
      - TEST_EXECUTOR_URL=http://test-executor:3001
      - QA_LOOP_EXECUTOR_URL=http://qa-loop-executor:3002
      - DATABASE_URL=postgresql://${POSTGRES_USER:-whynot_staging}:${POSTGRES_PASSWORD:-whynot_staging}@database:5432/${POSTGRES_DB:-whynot_staging}
      - NODE_ENV=staging
      - ALLOW_INTERNAL_SCAN=true
      - RATE_LIMIT_TEST_EXECUTION_MAX=50
      - RATE_LIMIT_TEST_GENERATION_MAX=50
      - RATE_LIMIT_MAX_REQUESTS=200
      - GITHUB_CALLBACK_URL=http://localhost:3110/api/auth/github/callback
      - GOOGLE_CALLBACK_URL=http://localhost:3110/api/auth/google/callback
      - SCREENSHOT_RETENTION_DAYS=30
      - VIDEO_DIR=/app/videos
    volumes:
      - ./gateway/src:/app/src
      - ./shared:/app/shared
      - videos_staging:/app/videos
    depends_on:
      database:
        condition: service_healthy
      ai-service:
        condition: service_started
      test-executor:
        condition: service_started
      qa-loop-executor:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health',(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:3110/api
        - VITE_WS_URL=ws://localhost:3111
        - VITE_QA_LOOP_WS_URL=ws://localhost:3112
    ports:
      - "5283:80"
    depends_on:
      - gateway
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  admin-frontend:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:3110/api
    ports:
      - "5284:80"
    depends_on:
      - gateway
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_staging_data:
  screenshots_staging:
  visual_diffs_staging:
  videos_staging:
